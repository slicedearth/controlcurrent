name: Source review

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-review
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: npm ci

      - name: Verify committed source selection
        run: npm run generate:check

      - name: Compare locked packages with the registry
        id: compare_sources
        continue-on-error: true
        run: npm outdated @mdn/browser-compat-data web-features --json > source-review.json

      - name: Summarise source review
        if: always()
        run: npm run source-review:summary -- source-review.json >> "$GITHUB_STEP_SUMMARY"

      - name: Require review when an update is available
        if: steps.compare_sources.outcome != 'success'
        run: exit 1

      - name: State read-only boundary
        if: always()
        run: |
          echo "This review does not edit packages or data."
          echo "It does not create issues, commits, pushes, deployments, or releases."
