name: Source update dry run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-update-dry-run
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: npm ci

      - name: Verify committed source selection
        run: npm run generate:check

      - name: Report current BCD package version
        run: npm view @mdn/browser-compat-data version --json

      - name: Report current Web Platform Features package version
        run: npm view web-features version --json

      - name: State dry-run boundary
        run: |
          echo "No package, data, issue, commit, push, workflow, or deployment was changed."
          echo "Review newer packages locally before updating the lockfile and selected source subset."
